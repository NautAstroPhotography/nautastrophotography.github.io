<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — NautAstro</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #161616;
    --line: #2b2b2b;
    --text: #ededed;
    --muted: #999999;
    --gold: #e8a545;
    --gray-accent: #7a7a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  /* Header / nav — identical across all pages */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    background: rgba(10,10,10,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo img {
    height: 36px;
    width: auto;
    display: block;
  }
  .nav-links {
    display: flex; align-items: center; gap: 32px;
  }
  .nav-links a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); text-decoration: none;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }

  @media (max-width: 640px) {
    .nav-links { gap: 18px; }
    .site-header { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
  }

  /* Page head */
  .page-head {
    max-width: 1100px; margin: 56px auto 40px; padding: 0 24px;
    border-bottom: 1px solid var(--line); padding-bottom: 24px;
  }
  .page-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gray-accent); margin-bottom: 10px;
  }
  .page-title {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: clamp(34px, 5vw, 52px); line-height: 1.05;
  }

  /* Gallery grid */
  .gallery-grid {
    max-width: 1100px; margin: 0 auto; padding: 0 24px 96px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  @media (max-width: 720px) { .gallery-grid { grid-template-columns: 1fr; } }

  .tile {
    position: relative; aspect-ratio: 1 / 1;
    background-color: var(--panel);
    background-size: cover; background-position: center;
    overflow: hidden; border: 1px solid var(--line);
  }
  .tile::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.15) 45%, transparent 70%);
    opacity: 0; transition: opacity 0.35s ease;
  }
  .tile:hover::after { opacity: 1; }
  .tile-log {
    position: absolute; left: 14px; right: 14px; bottom: 14px;
    z-index: 1;
    font-family: 'IBM Plex Mono', monospace;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .tile:hover .tile-log { opacity: 1; transform: translateY(0); }
  .tile-object { font-size: 14px; color: var(--gold); margin-bottom: 4px; }
  .tile-meta { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .tile { cursor: pointer; }

  /* Footer */

  .footer-social {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .footer-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 50%;
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  .footer-social a:hover {
    border-color: var(--gold);
    color: var(--gold);
  }
  .footer-social svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }
  .site-footer {
    padding: 40px 24px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,10,10,0.88);
    align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox-window {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    max-width: 900px; width: 100%;
    max-height: 85vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .lightbox-img {
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
    background: #000;
    display: block;
    cursor: zoom-in;
    transition: transform 0.2s ease;
    touch-action: none;
  }
  .lightbox-img.zoomed {
    cursor: grab;
    transition: none;
  }
  .lightbox-img.zoomed.dragging {
    cursor: grabbing;
  }
  .lightbox-zoom-hint {
    position: absolute;
    bottom: 14px; left: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(10,10,10,0.7);
    padding: 5px 10px;
    pointer-events: none;
    z-index: 1;
  }
  .lightbox-caption {
    padding: 18px 22px;
    border-top: 1px solid var(--line);
  }
  .lightbox-object {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .lightbox-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .lightbox-close {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.7);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    z-index: 1;
  }
  .lightbox-close:hover { border-color: var(--gold); color: var(--gold); }

  .lightbox-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.7);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    z-index: 1;
    user-select: none;
  }
  .lightbox-arrow:hover { border-color: var(--gold); color: var(--gold); }
  .lightbox-arrow.prev { left: 12px; }
  .lightbox-arrow.next { right: 12px; }
  .lightbox-arrow.hidden { display: none; }

  .lightbox-variant-label {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--gold);
    padding: 4px 10px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="NautAstro"></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="portfolio.html" class="active">Portfolio</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <div class="page-head">
    <p class="page-eyebrow">Observation Log</p>
    <h1 class="page-title">Full Portfolio</h1>
  </div>

  <div class="gallery-grid" id="gallery-grid"></div>

  <footer class="site-footer">
    <div class="footer-social">
      <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.85.07 1.17.05 2.1.25 2.83.53a5.7 5.7 0 0 1 2.06 1.34 5.7 5.7 0 0 1 1.34 2.06c.28.72.48 1.66.53 2.83.06 1.25.07 1.65.07 4.85s0 3.6-.07 4.85c-.05 1.17-.25 2.1-.53 2.83a5.7 5.7 0 0 1-1.34 2.06 5.7 5.7 0 0 1-2.06 1.34c-.72.28-1.66.48-2.83.53-1.25.06-1.65.07-4.85.07s-3.6 0-4.85-.07c-1.17-.05-2.1-.25-2.83-.53a5.7 5.7 0 0 1-2.06-1.34 5.7 5.7 0 0 1-1.34-2.06c-.28-.72-.48-1.66-.53-2.83C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.85c.05-1.17.25-2.1.53-2.83A5.7 5.7 0 0 1 4.14 2.26 5.7 5.7 0 0 1 6.2.92c.72-.28 1.66-.48 2.83-.53C10.28 2.2.07 10.6.07 12s0 3.6-.07 4.85M12 6.87A5.13 5.13 0 1 0 12 17.13 5.13 5.13 0 0 0 12 6.87m0 8.46a3.33 3.33 0 1 1 0-6.66 3.33 3.33 0 0 1 0 6.66m5.34-8.66a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4"/></svg>
      </a>
      <a href="https://tiktok.com/@yourhandle" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24"><path d="M16.6 5.82c-1-1-1.53-2.3-1.53-3.75h-3.4v13.8a2.6 2.6 0 1 1-2.6-2.6c.24 0 .48.03.7.09V9.9a6 6 0 1 0 5.3 5.96V9.5a7.9 7.9 0 0 0 4.53 1.43V7.5a4.7 4.7 0 0 1-3-1.68"/></svg>
      </a>
    </div>
    © 2026 NautAstro · Tucson, AZ
  </footer>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">
    <div class="lightbox-window">
      <div class="lightbox-close" onclick="closeLightbox()">✕</div>
      <div class="lightbox-arrow prev" id="lightbox-prev" onclick="showVariant(-1)">‹</div>
      <div class="lightbox-arrow next" id="lightbox-next" onclick="showVariant(1)">›</div>
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
      <p class="lightbox-zoom-hint" id="lightbox-zoom-hint">Click to zoom</p>
      <div class="lightbox-caption">
        <span class="lightbox-variant-label" id="lightbox-variant-label" style="display:none;"></span>
        <p class="lightbox-object" id="lightbox-object"></p>
        <p class="lightbox-meta" id="lightbox-meta"></p>
      </div>
    </div>
  </div>

  <script src="images-data.js"></script>
  <script>
    const galleryGrid = document.getElementById('gallery-grid');

    PORTFOLIO_IMAGES.forEach(img => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.backgroundImage = `url('${img.file}')`;
      tile.innerHTML = `
        <div class="tile-log">
          <p class="tile-object">${img.object}</p>
          <p class="tile-meta">${img.meta}</p>
        </div>
      `;
      tile.addEventListener('click', () => openLightbox(img));
      galleryGrid.appendChild(tile);
    });

    let currentEntry = null;
    let currentVariantIndex = 0;

    function openLightbox(entry) {
      currentEntry = entry;
      currentVariantIndex = 0;
      renderLightboxFrame();
      document.getElementById('lightbox').classList.add('open');
    }

    function renderLightboxFrame() {
      // Entries without "variants" behave as a single-image list of one.
      const variants = (currentEntry.variants && currentEntry.variants.length)
        ? currentEntry.variants
        : [{ file: currentEntry.file, label: null }];

      const variant = variants[currentVariantIndex];

      document.getElementById('lightbox-img').src = variant.file;
      document.getElementById('lightbox-object').innerHTML = currentEntry.object;
      document.getElementById('lightbox-meta').innerHTML = currentEntry.meta;

      const label = document.getElementById('lightbox-variant-label');
      if (variant.label) {
        label.textContent = variant.label;
        label.style.display = 'inline-block';
      } else {
        label.style.display = 'none';
      }

      // Only show arrows when there's more than one version to click through
      const showArrows = variants.length > 1;
      document.getElementById('lightbox-prev').classList.toggle('hidden', !showArrows);
      document.getElementById('lightbox-next').classList.toggle('hidden', !showArrows);

      resetZoom();
    }

    // ---- Zoom / pan ----
    const ZOOM_SCALE = 2.5;
    const lightboxImg = document.getElementById('lightbox-img');
    const zoomHint = document.getElementById('lightbox-zoom-hint');
    let isZoomed = false;
    let panX = 0, panY = 0;
    let dragStartX = 0, dragStartY = 0;
    let dragging = false;
    let movedDuringDrag = false;

    function resetZoom() {
      isZoomed = false;
      panX = 0; panY = 0;
      lightboxImg.classList.remove('zoomed', 'dragging');
      lightboxImg.style.transform = '';
      lightboxImg.style.transformOrigin = '';
      zoomHint.style.display = 'block';
      zoomHint.textContent = 'Click to zoom';
    }

    function applyTransform() {
      lightboxImg.style.transform = `scale(${ZOOM_SCALE}) translate(${panX}px, ${panY}px)`;
    }

    function clampPan() {
      // Rough bound so you can't drag the image entirely out of view
      const rect = lightboxImg.getBoundingClientRect();
      const maxX = (rect.width * (ZOOM_SCALE - 1)) / (2 * ZOOM_SCALE);
      const maxY = (rect.height * (ZOOM_SCALE - 1)) / (2 * ZOOM_SCALE);
      panX = Math.max(-maxX, Math.min(maxX, panX));
      panY = Math.max(-maxY, Math.min(maxY, panY));
    }

    lightboxImg.addEventListener('click', (e) => {
      if (movedDuringDrag) { movedDuringDrag = false; return; } // ignore click that ends a drag
      if (!isZoomed) {
        const rect = lightboxImg.getBoundingClientRect();
        const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
        const yPercent = ((e.clientY - rect.top) / rect.height) * 100;
        lightboxImg.style.transformOrigin = `${xPercent}% ${yPercent}%`;
        isZoomed = true;
        panX = 0; panY = 0;
        lightboxImg.classList.add('zoomed');
        applyTransform();
        zoomHint.textContent = 'Drag to pan · click to reset';
      } else {
        resetZoom();
      }
    });

    lightboxImg.addEventListener('mousedown', (e) => {
      if (!isZoomed) return;
      dragging = true;
      movedDuringDrag = false;
      dragStartX = e.clientX - panX * ZOOM_SCALE;
      dragStartY = e.clientY - panY * ZOOM_SCALE;
      lightboxImg.classList.add('dragging');
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      movedDuringDrag = true;
      panX = (e.clientX - dragStartX) / ZOOM_SCALE;
      panY = (e.clientY - dragStartY) / ZOOM_SCALE;
      clampPan();
      applyTransform();
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      lightboxImg.classList.remove('dragging');
    });

    // Basic touch support: tap to zoom, drag to pan
    let touchStartX = 0, touchStartY = 0;
    lightboxImg.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      if (isZoomed) {
        dragging = true;
        movedDuringDrag = false;
        touchStartX = t.clientX - panX * ZOOM_SCALE;
        touchStartY = t.clientY - panY * ZOOM_SCALE;
      }
    });
    lightboxImg.addEventListener('touchmove', (e) => {
      if (!dragging || e.touches.length !== 1) return;
      movedDuringDrag = true;
      const t = e.touches[0];
      panX = (t.clientX - touchStartX) / ZOOM_SCALE;
      panY = (t.clientY - touchStartY) / ZOOM_SCALE;
      clampPan();
      applyTransform();
    });
    lightboxImg.addEventListener('touchend', (e) => {
      dragging = false;
      if (movedDuringDrag) return;
      // Treat as a tap
      const rect = lightboxImg.getBoundingClientRect();
      const touch = e.changedTouches[0];
      if (!isZoomed) {
        const xPercent = ((touch.clientX - rect.left) / rect.width) * 100;
        const yPercent = ((touch.clientY - rect.top) / rect.height) * 100;
        lightboxImg.style.transformOrigin = `${xPercent}% ${yPercent}%`;
        isZoomed = true;
        panX = 0; panY = 0;
        lightboxImg.classList.add('zoomed');
        applyTransform();
        zoomHint.textContent = 'Drag to pan · tap to reset';
      } else {
        resetZoom();
      }
    });

    function showVariant(direction) {
      const variants = (currentEntry.variants && currentEntry.variants.length)
        ? currentEntry.variants
        : [{ file: currentEntry.file, label: null }];
      currentVariantIndex = (currentVariantIndex + direction + variants.length) % variants.length;
      renderLightboxFrame();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showVariant(-1);
      if (e.key === 'ArrowRight') showVariant(1);
    });
  </script>

</body>
</html>
