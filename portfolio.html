<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — NautAstro</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #161616;
    --line: #2b2b2b;
    --text: #ededed;
    --muted: #999999;
    --gold: #e8a545;
    --gray-accent: #7a7a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  /* Header / nav — identical across all pages */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    background: rgba(10,10,10,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo img {
    height: 60px;
    width: auto;
    display: block;
  }
  .nav-links {
    display: flex; align-items: center; gap: 32px;
  }
  .nav-links a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); text-decoration: none;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }

  @media (max-width: 640px) {
    .nav-links { gap: 18px; }
    .site-header { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
  }

  /* Page head */
  .page-head {
    max-width: 1100px; margin: 56px auto 40px; padding: 0 24px;
    border-bottom: 1px solid var(--line); padding-bottom: 24px;
  }
  .page-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gray-accent); margin-bottom: 10px;
  }
  .page-title {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: clamp(34px, 5vw, 52px); line-height: 1.05;
  }

  /* Gallery grid */
  .gallery-grid {
    max-width: 1100px; margin: 0 auto; padding: 0 24px 96px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  @media (max-width: 720px) { .gallery-grid { grid-template-columns: 1fr; } }

  .tile {
    position: relative; aspect-ratio: 1 / 1;
    background-color: var(--panel);
    background-size: cover; background-position: center;
    overflow: hidden; border: 1px solid var(--line);
  }
  .tile::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.15) 45%, transparent 70%);
    opacity: 0; transition: opacity 0.35s ease;
  }
  .tile:hover::after { opacity: 1; }
  .tile-log {
    position: absolute; left: 14px; right: 14px; bottom: 14px;
    font-family: 'IBM Plex Mono', monospace;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .tile:hover .tile-log { opacity: 1; transform: translateY(0); }
  .tile-object { font-size: 14px; color: var(--gold); margin-bottom: 4px; }
  .tile-meta { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .tile { cursor: pointer; }

  /* Footer */

  .footer-social {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .footer-social a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 50%;
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  .footer-social a:hover {
    border-color: var(--gold);
    color: var(--gold);
  }
  .footer-social svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }
  .site-footer {
    padding: 40px 24px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,10,10,0.88);
    align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox-window {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    max-width: 900px; width: 100%;
    max-height: 85vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .lightbox-img {
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
    background: #000;
    display: block;
  }
  .lightbox-caption {
    padding: 18px 22px;
    border-top: 1px solid var(--line);
  }
  .lightbox-object {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .lightbox-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .lightbox-close {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.7);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    z-index: 1;
  }
  .lightbox-close:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo"><img src="images/transparent logo 4.png" alt="NautAstro"></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="portfolio.html" class="active">Portfolio</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <div class="page-head">
    <p class="page-eyebrow">Observation Log</p>
    <h1 class="page-title">Full Portfolio</h1>
  </div>

  <div class="gallery-grid" id="gallery-grid"></div>

  <footer class="site-footer">
    <div class="footer-social">
      <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.85.07 1.17.05 2.1.25 2.83.53a5.7 5.7 0 0 1 2.06 1.34 5.7 5.7 0 0 1 1.34 2.06c.28.72.48 1.66.53 2.83.06 1.25.07 1.65.07 4.85s0 3.6-.07 4.85c-.05 1.17-.25 2.1-.53 2.83a5.7 5.7 0 0 1-1.34 2.06 5.7 5.7 0 0 1-2.06 1.34c-.72.28-1.66.48-2.83.53-1.25.06-1.65.07-4.85.07s-3.6 0-4.85-.07c-1.17-.05-2.1-.25-2.83-.53a5.7 5.7 0 0 1-2.06-1.34 5.7 5.7 0 0 1-1.34-2.06c-.28-.72-.48-1.66-.53-2.83C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.85c.05-1.17.25-2.1.53-2.83A5.7 5.7 0 0 1 4.14 2.26 5.7 5.7 0 0 1 6.2.92c.72-.28 1.66-.48 2.83-.53C10.28 2.2.07 10.6.07 12s0 3.6-.07 4.85M12 6.87A5.13 5.13 0 1 0 12 17.13 5.13 5.13 0 0 0 12 6.87m0 8.46a3.33 3.33 0 1 1 0-6.66 3.33 3.33 0 0 1 0 6.66m5.34-8.66a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4"/></svg>
      </a>
      <a href="https://tiktok.com/@yourhandle" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24"><path d="M16.6 5.82c-1-1-1.53-2.3-1.53-3.75h-3.4v13.8a2.6 2.6 0 1 1-2.6-2.6c.24 0 .48.03.7.09V9.9a6 6 0 1 0 5.3 5.96V9.5a7.9 7.9 0 0 0 4.53 1.43V7.5a4.7 4.7 0 0 1-3-1.68"/></svg>
      </a>
    </div>
    © 2026 NautAstro · Tucson, AZ
  </footer>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">
    <div class="lightbox-window">
      <div class="lightbox-close" onclick="closeLightbox()">✕</div>
      <img class="lightbox-img" id="lightbox-img" src="" alt="">
      <div class="lightbox-caption">
        <p class="lightbox-object" id="lightbox-object"></p>
        <p class="lightbox-meta" id="lightbox-meta"></p>
      </div>
    </div>
  </div>

  <script src="images-data.js"></script>
  <script>
    const galleryGrid = document.getElementById('gallery-grid');

    PORTFOLIO_IMAGES.forEach(img => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.backgroundImage = `url('${img.file}')`;
      tile.innerHTML = `
        <div class="tile-log">
          <p class="tile-object">${img.object}</p>
          <p class="tile-meta">${img.meta}</p>
        </div>
      `;
      tile.addEventListener('click', () => openLightbox(img.file, img.object, img.meta));
      galleryGrid.appendChild(tile);
    });

    function openLightbox(imgUrl, objectName, meta) {
      document.getElementById('lightbox-img').src = imgUrl;
      document.getElementById('lightbox-object').innerHTML = objectName;
      document.getElementById('lightbox-meta').innerHTML = meta;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
