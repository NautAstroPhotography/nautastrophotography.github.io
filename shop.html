<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Prints — Your Name Astrophotography</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #161616;
    --line: #2b2b2b;
    --text: #ededed;
    --muted: #999999;
    --gold: #e8a545;
    --gray-accent: #7a7a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* Header / nav — identical across all pages */
  .site-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    background: rgba(10,10,10,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: var(--text);
    text-decoration: none;
  }
  .nav-links {
    display: flex; align-items: center; gap: 32px;
  }
  .nav-links a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); text-decoration: none;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--text); }
  .nav-cta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--bg); background: var(--gold);
    padding: 10px 20px; text-decoration: none;
    border: 1px solid var(--gold);
    transition: background 0.25s ease, color 0.25s ease;
  }
  .nav-cta:hover { background: transparent; color: var(--gold); }

  @media (max-width: 640px) {
    .nav-links { gap: 18px; }
    .site-header { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
  }

  /* Page head */
  .page-head {
    max-width: 1100px; margin: 56px auto 40px; padding: 0 24px;
    border-bottom: 1px solid var(--line); padding-bottom: 24px;
  }
  .page-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gray-accent); margin-bottom: 10px;
  }
  .page-title {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: clamp(34px, 5vw, 52px); line-height: 1.05;
  }
  .page-sub {
    font-size: 15px; color: var(--muted); max-width: 520px;
    margin-top: 14px; line-height: 1.6;
  }

  /* Store slot */
  .store-slot {
    max-width: 1100px; margin: 0 auto; padding: 0 24px 96px;
    min-height: 400px;
  }

  /* Footer */
  .site-footer {
    padding: 40px 24px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Your Logo</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="shop.html" class="nav-cta active">Shop Prints</a>
    </nav>
  </header>

  <div class="page-head">
    <p class="page-eyebrow">Prints</p>
    <h1 class="page-title">Shop Prints</h1>
    <p class="page-sub">Fine-art and photographic prints of original deep-sky images, printed on demand and shipped directly to you.</p>
  </div>

  <div class="store-slot">
    <!--
      PASTE YOUR FOTOMOTO SNIPPET BELOW, replacing this comment block.
      It will look like:

      <script type="text/javascript" src="//widget.fotomoto.com/stores/script/YOUR-STORE-ID.js"></script>
      <noscript>...</noscript>

      Nothing else on this page needs to change — Fotomoto's script
      builds the product grid and checkout flow inside this div.
    -->
  </div>

  <footer class="site-footer">
    © 2026 Your Name · Tucson, AZ
  </footer>

</body>
</html>
